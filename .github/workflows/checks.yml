name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n scripts/build-base-iso.sh
          bash -n scripts/build-gentoo-iso.sh
      - name: Check shell script whitespace
        run: git diff --check
